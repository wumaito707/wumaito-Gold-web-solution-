                  <form action="https://formsubmit.co/adewoleadewumi61@gmail.com" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="_captcha" value="false">
    
    <label>
        Full Name:</label><br>
    <input type="text"placeholder="Your Full Name" name="fullname" required><br><br>

    <label>Email Address:</label><br>
    <input type="email"placeholder="Your Email Address" name="email" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Your Phone Number"name="phone" required><br><br>

    <label>Business/Company Name (Optional):</label><br>
    <input type="text" name="company"><br><br>

    <label>Type of Service Needed:</label><br>
    <input type="checkbox" name="service[]" value="Website Design"> Website Design<br>
    <input type="checkbox" name="service[]" value="Web App Development"> Web App Development<br>
    <input type="checkbox" name="service[]" value="Domain & Hosting"> Domain & Hosting<br>
    <input type="checkbox" name="service[]" value="E-commerce Setup"> E-commerce Setup<br>
    <input type="checkbox" name="service[]" value="Branding"> Branding / Logo Design<br>
    <input type="checkbox" name="service[]" value="Maintenance"> Maintenance / Update<br>
    <input type="checkbox" name="service[]" value="Others"> Others<br><br>

    <label>Brief Description of Your Project:</label><br>
    <textarea name="description" rows="4" cols="50"></textarea><br><br>

    <label>Do You Have a Budget Range?</label><br>
    <input type="radio" name="budget_range" value="Yes"> Yes<br>
    <input type="radio" name="budget_range" value="No"> No<br><br>

    <label>Your Budget (₦):</label><br>
    <input type="number" name="budget"><br><br>

    <label>Preferred Completion Time:</label><br>
    <select name="timeframe">
      <option value="1 Week">1 Week</option>
      <option value="2 Weeks">2 Weeks</option>
      <option value="1 Month">1 Month</option>
      <option value="Flexible">Flexible</option>
    </select><br><br>

    <label>How Did You Hear About Us?</label><br>
    <select name="referral">
      <option value="Instagram">Instagram</option>
      <option value="Facebook">Facebook</option>
      <option value="WhatsApp">WhatsApp</option>
      <option value="Referral">Referral</option>
      <option value="Others">Others</option>
    </select><br><br>

    <label>Additional Information / Notes:</label><br>
    <textarea name="notes" rows="3" cols="50"></textarea><br><br>

    <label>Upload File (Optional):</label><br>
    <input type="file" name="file"><br><br>

    <button type="submit" > <a href="submit.html">Submit</a></button>
  </form>
