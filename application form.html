<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form | Wumaito Gold</title>
  <link rel="stylesheet" href="application-form.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <h1 class="logo">
        <span class="highlight">WUMAITO GOLD</span> WEB SOLUTIONS
      </h1>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="service.html">Service</a>
        <a href="ourstuff.html">Our Stuff</a>
      </nav>
    </div>
  </header>

  <!-- FORM SECTION -->
  <section class="form-section">
    <h2>Application Form</h2>
    <p class="subtitle">
      Tell us about your project. We’ll take it from there.
    </p>

    <form action="https://formsubmit.co/adewoleadewumi61@gmail.com"
          method="POST"
          enctype="multipart/form-data">

      <input type="hidden" name="_captcha" value="false">

      <label>Full Name</label>
      <input type="text" name="fullname" placeholder="Your full name" required>

      <label>Email Address</label>
      <input type="email" name="email" placeholder="Your email address" required>

      <label>Phone Number</label>
      <input type="tel" name="phone" placeholder="Your phone number" required>

      <label>Business / Company Name (Optional)</label>
      <input type="text" name="company">

      <label>Type of Service Needed</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="service[]" value="Website Design"> Website Design</label>
        <label><input type="checkbox" name="service[]" value="Web App Development"> Web App Development</label>
        <label><input type="checkbox" name="service[]" value="Domain & Hosting"> Domain & Hosting</label>
        <label><input type="checkbox" name="service[]" value="E-commerce Setup"> E-commerce Setup</label>
        <label><input type="checkbox" name="service[]" value="Branding"> Branding / Logo Design</label>
        <label><input type="checkbox" name="service[]" value="Maintenance"> Maintenance / Updates</label>
        <label><input type="checkbox" name="service[]" value="Others"> Others</label>
      </div>

      <label>Brief Description of Your Project</label>
      <textarea name="description" rows="4"
        placeholder="Describe what you want us to build"></textarea>

      <label>Do You Have a Budget Range?</label>
      <div class="radio-group">
        <label><input type="radio" name="budget_range" value="Yes"> Yes</label>
        <label><input type="radio" name="budget_range" value="No"> No</label>
      </div>

      <label>Your Budget (₦)</label>
      <input type="number" name="budget" placeholder="Optional">

      <label>Preferred Completion Time</label>
      <select name="timeframe">
        <option>1 Week</option>
        <option>2 Weeks</option>
        <option>1 Month</option>
        <option>Flexible</option>
      </select>

      <label>How Did You Hear About Us?</label>
      <select name="referral">
        <option>Instagram</option>
        <option>Facebook</option>
        <option>WhatsApp</option>
        <option>Referral</option>
        <option>Others</option>
      </select>

      <label>Additional Information / Notes</label>
      <textarea name="notes" rows="3"></textarea>

      <label>Upload File (Optional)</label>
      <input type="file" name="file">

      <button type="submit">Submit Application</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2025 Wumaito Gold Web Solutions</p>
  </footer>

</body>
</html>
